
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Support Assistant</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script src="/script.js" defer></script>
</head>
<body>
  <main>
    <h1>Welcome</h1>
    <p>This is a demo website with a floating AI assistant.</p>
  </main>

  <button id="chat-toggle" aria-label="Open chat" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round" aria-hidden="true">
      <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8
      8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7
      a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9
      a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>
    </svg>
  </button>

  <section id="chat-panel" aria-label="AI chat" hidden>
    <header class="chat-header">
      <div>
        <strong>AI Assistant</strong>
        <div id="connection-status">Checking Ollama...</div>
      </div>
      <button id="new-chat" title="Start a new conversation">New chat</button>
      <button id="chat-close" aria-label="Minimize chat">×</button>
    </header>

    <div class="model-bar">
      <label for="model-role">Model role</label>
      <select id="model-role">
        <option value="chat">Chat — Nemotron Mini</option>
        <option value="reading">Reading — Nemotron Nano</option>
      </select>
      <div id="model-name">Checking model...</div>
    </div>

    <div class="model-bar" style="border-top: 1px solid #e2e8f0; padding-top: 8px;">
      <label for="user-role">Access level</label>
      <select id="user-role" style="font-weight: 600;">
        <option value="admin" selected>🔑 Admin (Full Access)</option>
        <option value="employee">💼 Employee (Staff)</option>
        <option value="customer">👤 Customer (Public)</option>
      </select>
      <div id="role-badge" style="font-size: 11px; color: #16a34a; font-weight: 600;">Full Access Enabled</div>
    </div>

    <div id="messages" aria-live="polite">
      <div class="message assistant">
        Hi! How can I help you today?
      </div>
    </div>

    <div id="typing" hidden>Thinking...</div>

    <form id="chat-form">
      <textarea id="message-input" rows="1"
        placeholder="Type your message..."
        aria-label="Your message" required></textarea>
      <button id="send-button" type="submit">Send</button>
    </form>

    <footer>Powered by local Ollama</footer>
  </section>
</body>
</html>
